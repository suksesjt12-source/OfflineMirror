name: Build OfflineMirror control variants

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build both signed release variants
        run: |
          set -o pipefail
          gradle assembleGamepadWifiRelease assembleTouchHidRelease --stacktrace 2>&1 | tee build-output.log

      - name: Prepare release files
        run: |
          mkdir -p release
          cp app/build/outputs/apk/gamepadWifi/release/*.apk release/OfflineMirror-Gamepad-WiFi-1.59.0-release.apk
          cp app/build/outputs/apk/touchHid/release/*.apk release/OfflineMirror-Touch-HID-Multitouch-1.59.0-release.apk
          sha256sum release/*.apk > release/SHA256SUMS.txt

      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMirror-build-diagnostics
          path: build-output.log
          if-no-files-found: warn

      - name: Upload both release APKs and checksums
        uses: actions/upload-artifact@v4
        with:
          name: OfflineMirror-1.59.0-release-apks
          path: release/*
          if-no-files-found: error
          retention-days: 14
