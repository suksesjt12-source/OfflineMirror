plugins {
    id "com.android.application"
}

android {
    namespace "com.offlinemirror.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.offlinemirror.app"
        minSdk 21
        targetSdk 35
        versionCode 74
        versionName "1.59.0"
    }

    buildFeatures { buildConfig true }
    flavorDimensions "input"
    productFlavors {
        gamepadWifi {
            dimension "input"
            applicationIdSuffix ".gamepadwifi"
            versionNameSuffix "-gamepad-wifi"
            buildConfigField "boolean", "VARIANT_DIRECT_TOUCH", "true"
        }
        touchHid {
            dimension "input"
            applicationIdSuffix ".touchhid"
            versionNameSuffix "-touch-hid"
            buildConfigField "boolean", "VARIANT_DIRECT_TOUCH", "false"
        }
    }
    buildTypes {
        debug { }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.4"
}
