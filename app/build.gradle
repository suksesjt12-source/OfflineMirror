plugins {
    id "com.android.application"
}

android {
    namespace "com.offlinemirror.app"
    compileSdk 35

    defaultConfig {
        applicationId "com.offlinemirror.app"
        minSdk 21
        targetSdk 35
        versionCode 70
        versionName "1.56.0"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.google.zxing:core:3.5.4"
}
